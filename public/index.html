<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Premium E-Commerce</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 50%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        .container {
            max-width: 600px;
            width: 90%;
            padding: 60px 40px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 1px rgba(212, 175, 55, 0.2);
            text-align: center;
        }
        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #c9aa71 0%, #d4af37 50%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.8;
        }
        .button {
            display: inline-block;
            padding: 18px 40px;
            margin: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1e2e;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.9) 0%, rgba(201, 170, 113, 0.9) 100%);
            border: 2px solid rgba(212, 175, 55, 0.5);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Inter', sans-serif;
        }
        .button:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 1) 0%, rgba(201, 170, 113, 1) 100%);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
            transform: translateY(-3px);
        }
        .button.secondary {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.9) 0%, rgba(34, 197, 94, 0.9) 100%);
            border-color: rgba(74, 222, 128, 0.5);
        }
        .button.secondary:hover {
            background: linear-gradient(135deg, rgba(74, 222, 128, 1) 0%, rgba(34, 197, 94, 1) 100%);
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Premium E-Commerce</h1>
        <p>Experience luxury shopping with our premium collection. Join us today!</p>
        <a href="/login" class="button">Login</a>
        <a href="/register" class="button secondary">Register</a>
    </div>
</body>
</html>
