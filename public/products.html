<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Premium E-Commerce</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 50%, #1a1a2e 100%);
            min-height: 100vh;
            color: #ffffff;
        }
        h1 {
            text-align: center;
            padding: 30px 20px;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #c9aa71 0%, #d4af37 50%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
        }
        #navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgba(30, 30, 46, 0.95) 0%, rgba(45, 45, 68, 0.95) 100%);
            backdrop-filter: blur(10px);
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }
        #navbar a {
            color: #ffffff;
            margin: 0 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 24px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(201, 170, 113, 0.1) 0%, rgba(212, 175, 55, 0.1) 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        #navbar a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        #navbar a:hover::before {
            left: 100%;
        }
        #navbar a:hover {
            background: linear-gradient(135deg, rgba(201, 170, 113, 0.3) 0%, rgba(212, 175, 55, 0.3) 100%);
            border-color: rgba(212, 175, 55, 0.6);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }
        #product-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .product-card {
            width: 280px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 1px rgba(212, 175, 55, 0.2);
            overflow: hidden;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #c9aa71, #d4af37, #ffd700, #d4af37, #c9aa71);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }
        .product-card:hover::before {
            transform: scaleX(1);
        }
        .product-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 30px rgba(212, 175, 55, 0.3);
            border-color: rgba(212, 175, 55, 0.5);
        }
        .product-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .product-card:hover img {
            transform: scale(1.1);
        }
        .product-card .product-details {
            padding: 20px;
        }
        .product-card h3 {
            font-size: 1.2rem;
            margin: 15px 0;
            color: #ffffff;
            font-weight: 600;
            line-height: 1.4;
        }
        .product-card p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .product-description {
            max-height: 60px;
            overflow: hidden;
            position: relative;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            line-height: 20px;
        }
        .product-description.expanded {
            max-height: none;
            -webkit-line-clamp: unset;
            display: block;
        }
        .read-more {
            color: #d4af37;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
            margin-top: 5px;
            display: inline-block;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .read-more:hover {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        .product-card .price {
            font-size: 1.5rem;
            margin: 15px 0;
            color: #4ade80;
            font-weight: 700;
        }
        .product-card .price span {
            text-decoration: line-through;
            color: #ef4444;
            font-size: 1rem;
            margin-left: 10px;
            opacity: 0.7;
        }
        .action-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
        }
        .action-buttons button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }
        .add-to-wishlist {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.8) 0%, rgba(201, 170, 113, 0.8) 100%);
            color: #1e1e2e;
            border: 1px solid rgba(212, 175, 55, 0.5);
        }
        .add-to-wishlist:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 1) 0%, rgba(201, 170, 113, 1) 100%);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            transform: translateY(-2px);
        }
        .add-to-cart {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.8) 0%, rgba(34, 197, 94, 0.8) 100%);
            color: #1e1e2e;
            border: 1px solid rgba(74, 222, 128, 0.5);
        }
        .add-to-cart:hover {
            background: linear-gradient(135deg, rgba(74, 222, 128, 1) 0%, rgba(34, 197, 94, 1) 100%);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.6);
            transform: translateY(-2px);
        }
        .logout-btn {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.8) 0%, rgba(220, 38, 38, 0.8) 100%);
            color: #1e1e2e;
            border: 1px solid rgba(239, 68, 68, 0.5);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        .logout-btn:hover {
            background: linear-gradient(135deg, rgba(239, 68, 68, 1) 0%, rgba(220, 38, 38, 1) 100%);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div id="navbar">
        <a id="wishlist-link" href="#">Go to Wishlist</a>
        <a id="cart-link" href="#">Go to Cart</a>
        <button id="logout-btn" class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
    <h1>Products</h1>
    <div id="product-container"></div>

    <script>
        function toggleDescription(descriptionId) {
            const descElement = document.getElementById(descriptionId);
            const readMoreBtn = descElement.nextElementSibling;
            
            if (descElement.classList.contains('expanded')) {
                descElement.classList.remove('expanded');
                readMoreBtn.textContent = 'Read more';
            } else {
                descElement.classList.add('expanded');
                readMoreBtn.textContent = 'Read less';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const productContainer = document.getElementById('product-container');
            const params = new URLSearchParams(window.location.search);
            const username = params.get('username'); // ✅ extract username from URL

            // ✅ dynamically update links
            if (username) {
                document.getElementById('wishlist-link').href = `wishlist.html?username=${encodeURIComponent(username)}`;
                document.getElementById('cart-link').href = `cart.html?username=${encodeURIComponent(username)}`;
            } else {
                alert('User not logged in.');
                return;
            }

            // Logout handler
            window.handleLogout = function() {
                if (confirm('Are you sure you want to logout?')) {
                    window.location.href = '/';
                }
            };

            // Fetch product data from the backend
            fetch('/products')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(products => {
                    if (products.length === 0) {
                        productContainer.innerHTML = '<p>No products available at the moment.</p>';
                        return;
                    }

                    products.forEach(product => {
                        const productImage = product.image || 'https://via.placeholder.com/250';

                        // Create product card
                        const card = document.createElement('div');
                        card.className = 'product-card';

                        const descriptionId = `desc-${product.id}`;
                        card.innerHTML = `
                            <img src="${productImage}" alt="${product.name}">
                            <div class="product-details">
                                <h3>${product.name}</h3>
                                <div class="product-description" id="${descriptionId}">
                                    <p>${product.description}</p>
                                </div>
                                <span class="read-more" onclick="toggleDescription('${descriptionId}')">Read more</span>
                                <div class="price">
                                    ₹${product.discountedPrice} 
                                    <span>₹${product.retailPrice}</span>
                                </div>
                            </div>
                            <div class="action-buttons">
                                <button class="add-to-wishlist" data-product-id="${product.id}">Add to Wishlist</button>
                                <button class="add-to-cart" data-product-id="${product.id}">Add to Cart</button>
                            </div>
                        `;

                        productContainer.appendChild(card);
                    });

                    // Add event listeners for buttons
                    document.querySelectorAll('.add-to-wishlist').forEach(button => {
                        button.addEventListener('click', (e) => {
                            const productId = e.target.getAttribute('data-product-id');
                            fetch(`/add-to-wishlist/${productId}?username=${username}`, { method: 'POST' })
                                .then(response => response.json())
                                .then(data => alert(data.message))
                                .catch(error => console.error('Error adding to wishlist:', error));
                        });
                    });

                    document.querySelectorAll('.add-to-cart').forEach(button => {
                        button.addEventListener('click', (e) => {
                            const productId = e.target.getAttribute('data-product-id');
                            fetch(`/add-to-cart/${productId}?username=${username}`, { method: 'POST' })
                                .then(response => response.json())
                                .then(data => alert(data.message))
                                .catch(error => console.error('Error adding to cart:', error));
                        });
                    });
                })
                .catch(error => {
                    console.error('Error fetching products:', error);
                    productContainer.innerHTML = '<p>Failed to load products. Please try again later.</p>';
                });
        });
    </script>
</body>
</html>
